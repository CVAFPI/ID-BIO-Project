<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ institution_name }} - CSV Migration</title>
    <style>
        :root { --bg:#10161f; --panel:#18212c; --panel-2:#202c3a; --line:#2d3b4b; --text:#e8eef7; --muted:#91a0b5; --accent:{{ accent_color }}; --good:#48d6aa; --bad:#f27676; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; color:var(--text); background:var(--bg); font-family:"Trebuchet MS","Segoe UI",sans-serif; }
        body[data-theme="light"] { --bg:#eef3f7; --panel:#fff; --panel-2:#e7eef5; --line:#cbd6e2; --text:#17202b; --muted:#5f6f82; }
        body[data-theme="grassy"] { --bg:#101b16; --panel:#17271f; --panel-2:#20372a; --line:#345441; --text:#e8f6ed; --muted:#9bb6a4; --accent:#71d39d; }
        body[data-theme="ocean"] { --bg:#071923; --panel:#0e2633; --panel-2:#153747; --line:#285369; --text:#e8f7fb; --muted:#9fc6d1; --accent:#5cd3e8; }
        body[data-theme="sunset"] { --bg:#21171a; --panel:#302126; --panel-2:#412b2e; --line:#644247; --text:#fff0e8; --muted:#c6a5a0; --accent:#ffad72; }
        input:not([type="checkbox"]):not([type="radio"]):not([type="color"]), select, textarea { color:var(--text); background:var(--bg); border-color:var(--line); }
        input::placeholder, textarea::placeholder { color:var(--muted); opacity:1; }
        input:focus, select:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent); outline:none; }
        input[type="checkbox"] { accent-color:var(--accent); }
        .shell { width:min(940px,calc(100% - 32px)); margin:auto; padding:26px 0; }
        header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--line); }
        .brand { display:flex; align-items:center; gap:12px; } .brand img { width:42px; height:42px; object-fit:contain; border:1px solid var(--line); border-radius:9px; padding:5px; background:var(--panel); }
        .eyebrow { color:var(--accent); font-size:.7rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; } h1 { margin:4px 0 0; font-size:1.2rem; }
        .nav { color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 12px; text-decoration:none; font-size:.8rem; font-weight:700; }
        .intro { padding:30px 0 22px; } .intro h2 { margin:0 0 8px; font-size:2rem; } .intro p { margin:0; color:var(--muted); line-height:1.5; }
        .card { padding:22px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
        .file-picker { display:block; padding:28px 20px; margin-top:18px; text-align:center; border:1px dashed var(--muted); border-radius:8px; cursor:pointer; } .file-picker.ready { border-color:var(--accent); }
        .file-picker strong,.file-picker span { display:block; } .file-picker span { margin-top:6px; color:var(--muted); font-size:.8rem; } .file-name { margin-top:12px; color:var(--accent); font-family:monospace; font-size:.8rem; }
        input[type=file] { display:none; } .mode { display:flex; gap:10px; margin-top:16px; padding:13px; border:1px solid var(--line); border-radius:7px; background:var(--panel-2); } .mode small { display:block; margin-top:4px; color:var(--muted); line-height:1.4; }
        .actions { display:flex; justify-content:flex-end; gap:9px; margin-top:18px; } button { padding:10px 14px; border:1px solid transparent; border-radius:6px; color:#fff; background:var(--accent); font-weight:700; cursor:pointer; } button.secondary { color:var(--muted); border-color:var(--line); background:transparent; } button:disabled { opacity:.45; cursor:not-allowed; }
        .result { display:none; margin-top:18px; padding:16px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); } .result.visible { display:block; } .result h3 { margin:0; color:var(--good); font-size:.95rem; } .result.error h3 { color:var(--bad); } .result p { color:var(--muted); line-height:1.5; }
        .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .stat { padding:10px; text-align:center; background:var(--panel); border-radius:6px; } .stat strong { display:block; color:var(--accent); font:700 1.2rem monospace; } .stat span { color:var(--muted); font-size:.7rem; text-transform:uppercase; }
        @media (max-width:560px) { .shell { width:calc(100% - 24px); padding-top:14px; } header { align-items:flex-start; } .actions { flex-direction:column; } button { width:100%; } }
    </style>
</head>
<body data-theme="{{ theme }}" style="--accent: {{ accent_color }};">
    <main class="shell">
        <header><div class="brand"><img src="{{ logo_url }}" alt="{{ institution_name }} logo"><div><div class="eyebrow">Data administration</div><h1>{{ institution_name }}</h1></div></div><a class="nav" href="/launchpad.html">Back to menu</a></header>
        <section class="intro"><h2>Manage the CSV student list.</h2><p>Review a CSV file, then merge new records or replace the current student list. Attendance history is not changed.</p></section>
        <section class="card">
            <label class="file-picker" id="filePicker" for="csvFile"><strong>Choose a CSV file</strong><span>Required columns: BARCODE and NAME. Optional: GRADE, SECTION, ACCESS, COLOR, NTFY_TOPIC.</span><div class="file-name" id="fileName">No file selected</div></label>
            <input id="csvFile" type="file" accept=".csv,text/csv">
            <label class="mode"><input id="replaceExisting" type="checkbox"><span><b>Replace the current student list</b><small>Leave unchecked to merge records and update matching barcodes.</small></span></label>
            <div class="actions"><button class="secondary" id="clearButton" type="button">Clear</button><button id="previewButton" type="button" disabled>Review CSV</button><button id="importButton" type="button" disabled>Import records</button></div>
            <div class="result" id="result"><h3 id="resultTitle"></h3><p id="resultMessage"></p><div class="stats" id="stats"></div></div>
        </section>
    </main>
    <link rel="stylesheet" href="/static/kiosk-dialog.css">
    <script src="/static/kiosk-dialog.js"></script>
    <script>
        const fileInput = document.getElementById('csvFile');
        const fileName = document.getElementById('fileName');
        const picker = document.getElementById('filePicker');
        const previewButton = document.getElementById('previewButton');
        const importButton = document.getElementById('importButton');
        const result = document.getElementById('result');
        let selectedFile = null;
        fileInput.addEventListener('change', () => { selectedFile = fileInput.files[0] || null; fileName.textContent = selectedFile ? selectedFile.name : 'No file selected'; picker.classList.toggle('ready', !!selectedFile); previewButton.disabled = !selectedFile; importButton.disabled = true; result.className = 'result'; });
        previewButton.addEventListener('click', async () => { if (!selectedFile) return; const form = new FormData(); form.append('file', selectedFile); await request('/api/migration/preview', form, false); });
        importButton.addEventListener('click', async () => { if (!selectedFile || !(await appConfirm('Import these student records into the CSV database?'))) return; const form = new FormData(); form.append('file', selectedFile); form.append('replace_existing', document.getElementById('replaceExisting').checked); await request('/api/migration/import', form, true); });
        document.getElementById('clearButton').addEventListener('click', () => { fileInput.value = ''; selectedFile = null; fileName.textContent = 'No file selected'; picker.classList.remove('ready'); previewButton.disabled = true; importButton.disabled = true; result.className = 'result'; });
        async function request(url, form, importing) { previewButton.disabled = true; importButton.disabled = true; try { const response = await fetch(url, { method:'POST', body:form }); const data = await response.json(); if (!response.ok) throw new Error(data.message || 'Request failed.'); result.className = 'result visible'; document.getElementById('resultTitle').textContent = importing ? 'Import complete' : (data.invalid_rows ? 'Review needed' : 'CSV is ready'); document.getElementById('resultMessage').textContent = importing ? `Imported ${data.imported} records using ${data.mode} mode. The CSV database now contains ${data.students} students.` : (data.errors || []).join(' ') || 'The file is ready to import.'; document.getElementById('stats').innerHTML = importing ? '' : `<div class="stat"><strong>${data.total_rows}</strong><span>Total rows</span></div><div class="stat"><strong>${data.valid_rows}</strong><span>Valid</span></div><div class="stat"><strong>${data.new_records}</strong><span>New</span></div>`; importButton.disabled = !!data.invalid_rows || importing; } catch (error) { result.className = 'result visible error'; document.getElementById('resultTitle').textContent = 'Unable to continue'; document.getElementById('resultMessage').textContent = error.message; document.getElementById('stats').innerHTML = ''; } finally { previewButton.disabled = !selectedFile; } }
    </script>
</body>
</html>
