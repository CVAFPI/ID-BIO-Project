name: Python 3.11 checks

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Application Code
      run: |
        source venv/bin/activate
        python3 -m py_compile app.py logger.py wsgi.py
        python3 -c "import wsgi; assert wsgi.app.name == 'app'"
        python3 -m unittest discover -s tests -v

  windows-build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: python -m pip install -r requirements.txt pyinstaller

    - name: Build Windows executable
      run: |
        python -m PyInstaller --clean --noconfirm ID-BIO-Project.spec
        if (!(Test-Path "dist\CVAFPI-IDSYS.exe")) { throw "PyInstaller output is missing" }
