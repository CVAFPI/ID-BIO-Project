<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="pageTitle">CVA - DATABASE</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #2563eb;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #1e293b; border-bottom: 1px solid var(--border); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 36px; width: 36px; object-fit: contain; }
        .header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .clock { color: #38bdf8; font-family: monospace; font-size: 0.95rem; font-weight: 600; }
        .nav-btn { background: #334155; color: white; padding: 6px 14px; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }

        .main-container { display: flex; flex: 1; padding: 16px; gap: 16px; overflow: hidden; }
        
        /* Left: Table & Search */
        .left-column { flex: 1; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .toolbar { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; background: #162238; }
        .search-box { flex: 1; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 0.9rem; outline: none; }
        
        .table-container { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th { padding: 10px 14px; color: var(--muted); background: #162238; position: sticky; top: 0; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 0.7rem; }
        td { padding: 10px 14px; border-bottom: 1px solid #162238; }
        tr:hover { background: #253349; }
        
        .action-icon { cursor: pointer; margin-right: 8px; font-size: 1rem; }

        /* Right: Student Tools Form */
        .right-column { width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .right-column h3 { font-size: 0.9rem; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
        
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }
        .form-input { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: #fff; font-size: 0.95rem; outline: none; }
        .form-input:focus { border-color: var(--accent); }

        .caps-toggle-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); }
        .caps-toggle-row span { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .access-row { display: flex; gap: 8px; align-items: center; }
        .access-row input[type="text"] { flex: 1; }
        .color-picker { width: 38px; height: 38px; border: none; border-radius: 6px; cursor: pointer; background: none; }
        
        .color-presets { display: flex; gap: 5px; margin-top: 4px; }
        .preset-btn { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; border: none; cursor: pointer; font-weight: 700; color: #000; }

        .btn-save { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 12px; font-weight: 600; cursor: pointer; width: 100%; font-size: 0.9rem; text-transform: uppercase; }
        .btn-save:hover { background: #1d4ed8; }
        .btn-clear { background: #334155; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 0.85rem; }
        .btn-clear:hover { background: #475569; }

        .badge { padding: 3px 8px; border-radius: 4px; font-weight: 700; font-size: 0.75rem; display: inline-block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="CVAFPI-LOGO.png" alt="CVA Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>CVA - DATABASE</h1>
        </div>
        <div class="header-right">
            <div class="clock" id="clockDisplay">Loading PHT...</div>
            <a href="launchpad.html" class="nav-btn">← MENU</a>
        </div>
    </div>

    <div class="main-container">
        <!-- Left: Records Table -->
        <div class="left-column">
            <div class="toolbar">
                <input type="text" id="dbSearch" class="search-box" placeholder="🔍 Search records by name, barcode, grade..." oninput="filterTable()">
                <div id="recordCount" style="color: var(--muted); font-size: 0.85rem; font-family: monospace;">0 records</div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Barcode</th>
                            <th>Name</th>
                            <th>Grade</th>
                            <th>Section</th>
                            <th>Access & Style</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dbTableBody">
                        <tr><td colspan="6" style="text-align: center; color: var(--muted); padding: 20px;">Loading database...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right: Student Tools Form -->
        <div class="right-column">
            <h3>Student Tools</h3>
            
            <div class="caps-toggle-row">
                <span>Caps Lock (Auto-Uppercase)</span>
                <label class="switch">
                    <input type="checkbox" id="capsToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label>Barcode</label>
                <input type="text" id="inputBarcode" class="form-input" placeholder="Scan or type barcode...">
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="inputName" class="form-input" placeholder="Last Name, First Name M.I.">
            </div>

            <div class="form-group">
                <label>Grade</label>
                <input type="text" id="inputGrade" class="form-input" value="GRADE ">
            </div>

            <div class="form-group">
                <label>Section</label>
                <input type="text" id="inputSection" class="form-input" placeholder="e.g. ICT-SIMEON">
            </div>

            <div class="form-group">
                <label>Access Level & Badge Color</label>
                <div class="access-row">
                    <!-- Color picker placed on the left so its popup opens safely inwards -->
                    <input type="color" id="inputColor" class="color-picker" value="#059669" title="Pick custom badge background color">
                    <input type="text" id="inputAccess" class="form-input" value="REGULAR" placeholder="REGULAR, LCHPSS, STAFF...">
                </div>
                <div class="color-presets">
                    <button class="preset-btn" style="background:#f59e0b;" onclick="setPresetColor('#f59e0b', 'LCHPSS')">LCHPSS (Yellow)</button>
                    <button class="preset-btn" style="background:#059669; color:#fff;" onclick="setPresetColor('#059669', 'REGULAR')">Regular (Green)</button>
                    <button class="preset-btn" style="background:#dc2626; color:#fff;" onclick="setPresetColor('#dc2626', 'DENIED')">Denied (Red)</button>
                </div>
            </div>

            <button class="btn-save" onclick="saveStudent()">💾 Save / Update</button>
            <button class="btn-clear" onclick="clearFields()">Clear Fields</button>
        </div>
    </div>

    <script>
        let allStudents = [];

        // Clock Update
        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Manila', hour12: true, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const phtString = new Intl.DateTimeFormat('en-US', options).format(now);
            document.getElementById('clockDisplay').innerText = `PHT: ${phtString}`;
            document.getElementById('pageTitle').innerText = `CVA - DATABASE | ${phtString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Auto Caps Lock Enforcement on inputs
        const textInputs = ['inputBarcode', 'inputName', 'inputGrade', 'inputSection', 'inputAccess'];
        textInputs.forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                if (document.getElementById('capsToggle').checked) {
                    this.value = this.value.toUpperCase();
                }
            });
        });

        function setPresetColor(hex, accessName) {
            document.getElementById('inputColor').value = hex;
            if(accessName) {
                document.getElementById('inputAccess').value = accessName;
            }
        }

        async function fetchDatabase() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                allStudents = data;
                filterTable();
            } catch (err) {
                console.error("Failed to load database:", err);
            }
        }

        function filterTable() {
            const query = document.getElementById('dbSearch').value.toLowerCase();
            const filtered = allStudents.filter(row => row.some(cell => cell.toLowerCase().includes(query)));
            
            document.getElementById('recordCount').innerText = `${filtered.length} records`;
            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('dbTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--muted); padding: 20px;">No student records found.</td></tr>`;
                return;
            }

            data.forEach(row => {
                const [barcode, name, grade, section, access = 'REGULAR', color = '#059669'] = row;
                
                tbody.innerHTML += `
                    <tr>
                        <td style="font-family: monospace;">${barcode || ''}</td>
                        <td style="font-weight: 600; color: #fff;">${name || ''}</td>
                        <td>${grade || ''}</td>
                        <td>${section || ''}</td>
                        <td><span class="badge" style="background-color: ${color}; color: #fff;">${access}</span></td>
                        <td>
                            <span class="action-icon" title="Edit" onclick="editStudent('${barcode}', '${encodeURIComponent(name)}', '${encodeURIComponent(grade)}', '${encodeURIComponent(section)}', '${encodeURIComponent(access)}', '${color}')">✏️</span>
                            <span class="action-icon" title="Delete" onclick="deleteStudent('${barcode}')">🗑️</span>
                        </td>
                    </tr>
                `;
            });
        }

        function editStudent(barcode, name, grade, section, access, color) {
            document.getElementById('inputBarcode').value = barcode;
            document.getElementById('inputName').value = decodeURIComponent(name);
            document.getElementById('inputGrade').value = decodeURIComponent(grade);
            document.getElementById('inputSection').value = decodeURIComponent(section);
            document.getElementById('inputAccess').value = decodeURIComponent(access);
            document.getElementById('inputColor').value = color || '#059669';
        }

        async function saveStudent() {
            const b = document.getElementById('inputBarcode').value.trim();
            const n = document.getElementById('inputName').value.trim();
            const g = document.getElementById('inputGrade').value.trim();
            const s = document.getElementById('inputSection').value.trim();
            const a = document.getElementById('inputAccess').value.trim() || 'REGULAR';
            const c = document.getElementById('inputColor').value;

            if (!b || !n) {
                alert('Barcode and Full Name are required!');
                return;
            }

            try {
                const res = await fetch('/api/save_student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ b, n, g, s, a, c })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    clearFields();
                    fetchDatabase();
                }
            } catch (err) {
                console.error("Save error:", err);
            }
        }

        async function deleteStudent(barcode) {
            if (!confirm(`Are you sure you want to delete barcode ${barcode}?`)) return;
            try {
                const res = await fetch('/api/delete_student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ barcode })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    fetchDatabase();
                }
            } catch (err) {
                console.error("Delete error:", err);
            }
        }

        function clearFields() {
            document.getElementById('inputBarcode').value = '';
            document.getElementById('inputName').value = '';
            document.getElementById('inputGrade').value = 'GRADE ';
            document.getElementById('inputSection').value = '';
            document.getElementById('inputAccess').value = 'REGULAR';
            document.getElementById('inputColor').value = '#059669';
        }

        fetchDatabase();
    </script>
</body>
</html>
