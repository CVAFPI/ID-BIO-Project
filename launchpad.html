<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #001a33; font-family: 'Segoe UI', Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .menu-container { background: #ffffff; padding: 40px 50px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border-bottom: 6px solid #FFD700; max-width: 500px; width: 100%; }
        .logo-img { width: 110px; height: 110px; margin: 0 auto 15px auto; display: block; border-radius: 50%; border: 3px solid #003366; background: #fff;}
        h1 { color: #003366; margin: 0 0 5px 0; font-size: 1.8rem; letter-spacing: 1px;}
        p { color: #666; margin-bottom: 30px; font-size: 1rem; }
        button { display: block; width: 100%; padding: 16px; margin-bottom: 15px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; background-color: #004488; }
        button:hover { background-color: #002244; }
        .btn-close { background-color: #dc3545; }
    </style>
</head>
<body>
    <!-- Replace your current buttons div with this: -->
    <div class="buttons">
        <button onclick="window.location.href='scanner.html'">🔍 LAUNCH REGISTRY SCANNER</button>
        <button onclick="window.location.href='manager.html'">📝 OPEN DATABASE MANAGER</button>
        <button onclick="window.location.href='logs-manager.html'">📁 OPEN LOGS MANAGER</button>
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button onclick="sysCmd('reboot')" style="background: #eab308; flex: 1;">🔄 REBOOT</button>
            <button onclick="sysCmd('shutdown')" style="background: #dc2626; flex: 1;">⏻ SHUTDOWN</button>
        </div>
        <button onclick="sysCmd('exit')" style="background: #4b5563; margin-top: 10px;">❌ EXIT SYSTEM</button>
    </div>
    
    <script>
        async function sysCmd(cmd) {
            if(confirm("Confirm action: " + cmd.toUpperCase() + "?")) {
                await fetch('/api/system', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({cmd}) 
                });
            }
        }
    </script>
</body>
</html>
